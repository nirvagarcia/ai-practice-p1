[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-assistant"
version = "0.1.0"
description = "Educational lab: controlled agentic banking assistant (synthetic data only)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "langchain-core>=1.6,<2",
    "langchain-openai>=1.6,<2",
    "openai>=3.3,<4",
    "langgraph>=1.2,<2",
    "chromadb>=1.5,<2",
    "opentelemetry-api>=1.45,<2",
    "opentelemetry-sdk>=1.45,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.16"]
# langchain-community 0.4.2 dropped a module that ragas 0.4.3 imports.
eval = ["ragas==0.4.3", "langchain-community==0.4.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
